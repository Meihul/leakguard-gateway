rank: [allow, warn, mask, confirm, approve, block]

promptguard:
  block_threshold: 0.9
  warn_threshold: 0.5

session_risk:
  # Per-user in-memory score: +1 for every warn/confirm/injection_suspected
  # finding, decaying out of the window after decay_seconds. Once a user's
  # score (from BEFORE the current request) is at or above threshold, their
  # next confirm-level request is escalated straight to block instead.
  threshold: 3
  decay_seconds: 600
  points_per_event: 1

rag:
  # Chroma cosine distance above which a retrieved chunk is treated as not
  # actually relevant to the query (and dropped) rather than just "the
  # least-dissimilar of the corpus".
  relevance_threshold: 1.6

  # The restricted_doc check is stricter than plain relevance: a tighter
  # absolute cutoff (most false positives, e.g. an email-drafting task
  # that happens to mention "HR" and "records", land in the 1.38-1.48
  # range; genuine restricted-document requests measured well under 1.3),
  # AND the restricted match must be clearly closer than the best allowed
  # match by at least restricted_doc_margin — so a restricted document
  # that's merely "less dissimilar" than an equally-irrelevant allowed one
  # never triggers an approval request.
  restricted_doc_threshold: 1.3
  restricted_doc_margin: 0.3

categories:
  aadhaar:
    action: mask
    severity: high
    user_message: "We hid your Aadhaar number before sending your message to the AI."
  pan:
    action: mask
    severity: high
    user_message: "We hid your PAN number before sending your message to the AI."
  phone:
    action: mask
    severity: medium
    user_message: "We hid your phone number before sending your message to the AI."
  card:
    action: mask
    severity: high
    user_message: "We hid your card number before sending your message to the AI."
  api_key:
    action: mask
    severity: critical
    user_message: "We removed an API key from your message before sending it to the AI. The security team has been notified."
  password:
    action: mask
    severity: critical
    user_message: "We removed a password from your message before sending it to the AI. The security team has been notified."
  private_key:
    action: mask
    severity: critical
    user_message: "We removed a private key from your message before sending it to the AI. The security team has been notified."
  injection:
    action: block
    severity: critical
    user_message: "We blocked this message because it looked like an attempt to manipulate the AI."
  injection_suspected:
    action: confirm
    severity: medium
    user_message: "Your message looked a little unusual, so please confirm you want to send it before we continue."
  restricted_doc:
    action: approve
    severity: high
    user_message: "This needs HR approval. Your request has been sent."
  canary_leak:
    action: block
    severity: critical
    user_message: "We blocked this response because it may have leaked internal data. The security team has been notified."
  session_risk_escalation:
    action: block
    severity: critical
    user_message: "Your recent activity triggered extra scrutiny, so this message has been blocked. Please contact the security team if you believe this is a mistake."
